services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: agent-security-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_sec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_sec"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
